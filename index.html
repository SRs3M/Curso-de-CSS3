<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <!--rel="stylesheet" indica que vamos a usar css, en href poner la dirección del style.css-->
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <h1 class="color">propiedad color</h1>
    <h1 id="titulo">Titulo</h1>
    <!--Se pueden asignar multiples clases a un objeto separandolas con un espacio-->

    <p class="texto especial">texto parrafo chanchito feliz</p>
    <p class="especial">texto parrafo chanchito feliz</p>
    <div>
        <p>Hola chanchito feliz</p>
        <h2>Soy un subtitulo</h2>
        <h3>Soy un subsubtitulo</h3>
    </div>
</body>
</html>
